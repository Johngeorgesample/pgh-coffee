[build]
  # Skip all git-push builds; deploys happen only via build hook (curl).
  # Build hooks bypass this ignore command per Netlify docs.
  ignore = "exit 0"

[[redirects]]
  from = "/js/script.js"
  to = "https://plausible.io/js/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/js/script.outbound-links.js"
  to = "https://plausible.io/js/script.outbound-links.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true
